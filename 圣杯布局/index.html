<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>兼容 IE8 的布局</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      .container {
        height: 100%;
      }

      header {
        height: 50px;
        background-color: #f0f0f0;
        text-align: center;
        line-height: 50px;
      }

      .main-content {
        height: calc(100% - 100px); /* 视窗高度减去 header 和 footer 的高度 */
        overflow: hidden;
      }

      .left-column,
      .right-column {
        width: 200px; /* 固定宽度 */
        height: 100%;
        background-color: #d0d0d0;
        float: left;
        overflow: auto; /* 如果内容超出高度，显示滚动条 */
      }

      .right-column {
        float: right;
      }

      .middle-content {
        height: 100%;
        background-color: #c0c0c0;
        margin-left: 200px; /* 左边列的宽度 */
        margin-right: 200px; /* 右边列的宽度 */
        overflow: auto; /* 如果内容超出高度，显示滚动条 */
        padding: 10px;
      }

      footer {
        height: 50px;
        background-color: #f0f0f0;
        text-align: center;
        line-height: 50px;
        clear: both; /* 清除浮动 */
      }
    </style>
    <!--[if lt IE 9]>
      <style>
        .main-content {
          height: expression((document.documentElement.clientHeight - 100) + 'px');
        }
        .left-column,
        .right-column {
          height: expression((document.documentElement.clientHeight - 100) + 'px');
        }
        .middle-content {
          height: expression((document.documentElement.clientHeight - 100) + 'px');
        }
      </style>
    <![endif]-->
  </head>
  <body>
    <div class="container">
      <header>Header</header>
      <div class="main-content">
        <div class="left-column">Left Column</div>
        <div class="right-column">Right Column</div>
        <div class="middle-content">
          <p>Middle Content</p>
          <p>This is the main content area.</p>
        </div>
      </div>
      <footer>Footer</footer>
    </div>
  </body>
</html>
