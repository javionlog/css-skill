<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>圣杯布局</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      .container {
        display: grid;
        grid-template-rows: auto 1fr auto; /* header、中间部分、footer */
        grid-template-columns: 200px 1fr 150px; /* 左侧边栏、中间内容、右侧边栏 */
        height: 100vh;
      }

      header,
      footer {
        grid-column: 1 / -1; /* 跨越所有列 */
        background: lightgray;
        padding: 10px;
      }

      .left {
        background: lightblue;
      }

      .main {
        background: lightcoral;
      }

      .right {
        background: lightgreen;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>Header</header>
      <div class="left">左侧边栏</div>
      <div class="main">中间内容</div>
      <div class="right">右侧边栏</div>
      <footer>Footer</footer>
    </div>
  </body>
</html>
