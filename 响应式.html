<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>响应式</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
    </style>
    <script>
      ;(() => {
        const resize = () => {
          const clientWidth = document.documentElement.clientWidth
          document.documentElement.style.fontSize = 100 * (clientWidth / 750) + 'px'
          console.log(document.documentElement.style.fontSize)
        }
        resize()
        window.onresize = () => {
          resize()
        }
      })()
    </script>
  </head>
  <body>
    <div style="overflow: hidden">
      <div style="width: 3.75rem; height: 2rem; background-color: green; float: left"></div>
      <div style="width: 3.75rem; height: 2rem; background-color: blue; float: left"></div>
    </div>
    <div style="border: 1.5px solid red">Hello, 你好，哇哈哈</div>
  </body>
</html>
