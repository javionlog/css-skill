<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>多行文本溢出</title>
    <style>
      /* 方案一：伪元素覆盖方案 */
      .ellipsis-box {
        position: relative;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        line-height: 1.5;
        padding-right: 60px;
        transition: padding 0.2s ease;
      }

      .ellipsis-box::after {
        content: '... 展开';
        position: absolute;
        right: 0;
        bottom: 0;
        background: linear-gradient(to right, transparent 30%, #fff 70%);
        padding-left: 8px;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      /* 方案二：方向翻转方案 */
      .rtl-box::before {
        content: '展开...';
        float: right;
        clear: both;
        direction: ltr;
        margin-left: 8px;
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      /* 自动检测逻辑 */
      .ellipsis-box:hover::after,
      .rtl-box:hover::before {
        opacity: 1;
        visibility: visible;
      }
    </style>
  </head>
  <body>
    <div class="ellipsis-box">
      这里是非常长的文本内容，当超过指定行数时会显示省略号并在结尾添加自定义内容。这里是非常长的文本内容，当超过指定行数时会显示省略号并在结尾添加自定义内容。
    </div>

    <div class="rtl-box">
      这里是非常长的文本内容，当超过指定行数时会显示省略号并在结尾添加自定义内容。这里是非常长的文本内容，当超过指定行数时会显示省略号并在结尾添加自定义内容。
    </div>
  </body>
</html>
